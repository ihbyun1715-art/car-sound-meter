name: Build Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk car-sound-meter.apk
      - uses: actions/upload-artifact@v4
        with:
          name: car-sound-meter-apk
          path: car-sound-meter.apk
      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest car-sound-meter.apk --target "${{ github.sha }}" --title "최신 빌드" --notes "휴대폰에서 car-sound-meter.apk를 눌러 받아 설치하세요. 빌드: ${{ github.sha }}"
